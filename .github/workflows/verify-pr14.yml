name: Verify PR14 before and after
on:
  push:
    branches: [verify/pr14-cross-platform-20260921]
permissions:
  contents: read
jobs:
  reproduce-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov
      - name: Reproduce on unchanged main
        run: |
          git restore --source=bbaf8b92d219099f6d3c72fb627891634a52d657 -- plugins/claude-bionify/scripts/bionify.py
          python verification/reproduce.py broken
      - name: Verify exact PR fix
        run: |
          git restore --source=ad8c59b97e9d96194fe609b0d0544078291ec0b1 -- plugins/claude-bionify/scripts/bionify.py
          python verification/reproduce.py fixed
      - name: Run full PR test suite
        run: python -m pytest tests/ -q --cov=plugins/claude-bionify/scripts --cov-report=term-missing --cov-fail-under=80
